name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate npm package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/npm-goodboy
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify release tag and registry order
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          curl --fail --silent --show-error --output /dev/null \
            "https://pypi.org/pypi/goodboy-codex/${VERSION}/json"
          if npm view "@adamallcock/goodboy@${VERSION}" version >/dev/null 2>&1; then
            echo "@adamallcock/goodboy@${VERSION} is already published" >&2
            exit 1
          fi

      - name: Test launcher
        run: node --test tests/launcher.test.mjs

      - name: Inspect package contents
        run: npm pack --dry-run --json

  publish:
    name: Publish npm
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/npm-goodboy
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish with npm trusted publishing
        run: npm publish --access public
