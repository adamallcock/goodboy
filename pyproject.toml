[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goodboy-codex"
version = "0.2.1"
description = "Repeatable pipeline for turning pet references into Codex pet spritesheets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = [
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "src/goodboy/vendor/hatch_pet/LICENSE.txt",
]
authors = [
  { name = "Adam Allcock" },
]
keywords = ["codex", "pets", "spritesheets", "image-generation", "qa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/adamallcock/goodboy"
Repository = "https://github.com/adamallcock/goodboy"
Issues = "https://github.com/adamallcock/goodboy/issues"
NPM = "https://www.npmjs.com/package/@adamallcock/goodboy"
PyPI = "https://pypi.org/project/goodboy-codex/"

[project.optional-dependencies]
ui = [
  "fastapi>=0.115.0",
  "httpx2>=2.0.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
]
dev = [
  "fastapi>=0.115.0",
  "httpx2>=2.0.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
  "pytest>=8.0.0",
  "build>=1.2.0",
]

[project.scripts]
goodboy = "goodboy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"goodboy.vendor.hatch_pet" = [
  "LICENSE.txt",
  "SNAPSHOT.json",
  "references/*.md",
  "scripts/*.py",
]
"goodboy.web" = [
  "static/index.html",
  "static/assets/*",
  "static/assets/demo/*",
  "static/assets/demo/companion/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
