[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goodboy"
version = "0.1.0"
description = "Repeatable pipeline for turning pet references into Codex pet spritesheets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
ui = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
goodboy = "goodboy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
